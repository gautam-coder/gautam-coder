name: Metrics

on:
  schedule:
    - cron: "30 5 * * *" # daily refresh
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}           # 👈 required to fetch data
          committer_token: ${{ secrets.METRICS_TOKEN }} # 👈 required to commit file back
          committer_branch: main                        # 👈 branch to commit into
          user: gautam-coder
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          plugin_isocalendar: yes
          plugin_languages: yes
          plugin_stars: yes
          plugin_habits: yes
